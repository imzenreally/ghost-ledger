<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>{% block title %}Ghost Ledger{% endblock %}</title>
<style>
:root{--bg:#0c1018;--panel:#141b27;--line:#283448;--text:#ecf0f8;--muted:#9faec2;--blue:#95c5ff;--yellow:#f6cb7b;--red:#ff9d9d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 0,#1d2940 0,transparent 45%),var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}main{max-width:1380px;margin:auto;padding:38px 30px 24px}header{display:flex;gap:20px;align-items:center;justify-content:space-between;margin-bottom:30px}.brand{display:flex;align-items:center;gap:15px}.ghost{width:44px;height:48px;border:2px solid var(--blue);border-radius:22px 22px 6px 6px;display:grid;place-items:center;color:var(--blue);font-size:22px;letter-spacing:3px;background:#1b2840}.eyebrow{text-transform:uppercase;letter-spacing:.17em;font-size:11px;color:var(--blue);font-weight:650}h1{font-size:30px;font-weight:650;letter-spacing:-.04em;line-height:1.2;margin:5px 0}h2{font-size:17px;margin:0}p{margin:8px 0}.muted,small{color:var(--muted)}.pill{display:inline-block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;padding:4px 9px;border:1px solid var(--line);border-radius:20px;color:var(--muted)}.intro{display:flex;justify-content:space-between;gap:22px;align-items:start;margin-bottom:22px}.intro h2{font-size:23px;letter-spacing:-.025em}.snapshot{font-size:12px;text-align:right}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.card,.panel{border:1px solid var(--line);border-radius:12px;background:var(--panel)}.card{padding:17px 20px}.card .number{font-size:30px;line-height:1.3;letter-spacing:-.04em;font-variant-numeric:tabular-nums}.card.attention{border-color:#644a32}.attention .number{color:var(--yellow)}.panel-head{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:18px 20px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;padding:13px 18px;background:#111722}td{padding:15px 18px;border-top:1px solid var(--line);vertical-align:top}td.site{min-width:180px;max-width:260px;overflow-wrap:anywhere}td.reason{min-width:190px;max-width:330px;overflow-wrap:anywhere;color:var(--muted)}td.money{white-space:nowrap;font-variant-numeric:tabular-nums}time{white-space:nowrap}.state{border-radius:5px;padding:4px 7px;background:#263347;color:var(--blue);font-size:11px;font-weight:650}.conflict .state,.ambiguous .state,.invalid .state{background:#4c2b2c;color:var(--red)}tr.conflict{background:#251d24}tr.conflict td:first-child{box-shadow:inset 3px 0 var(--red)}.protected .state,.imported .state{background:#203a35;color:#a3d8c5}.empty{text-align:center;padding:55px 20px}.pagination{display:flex;gap:20px;align-items:center;justify-content:flex-end;padding:16px 20px;border-top:1px solid var(--line);font-size:12px}.notice{padding:16px 20px;border:1px solid var(--line);border-radius:10px;margin-top:18px;color:var(--muted);font-size:13px}footer{display:flex;justify-content:space-between;gap:15px;margin-top:22px;font-size:11px;color:var(--muted)}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}button{background:#22344d;color:var(--text);border:1px solid #3b5576;border-radius:7px;padding:9px 16px;font:inherit;cursor:pointer}button:hover{background:#2d4361}.login{max-width:440px;margin:10vh auto}.login .panel{padding:28px}label{display:block;margin:24px 0 16px;font-size:13px}input[type=password]{display:block;width:100%;padding:11px;margin-top:7px;border:1px solid #41516b;border-radius:6px;background:#0b111b;color:var(--text);font:inherit}input:focus,button:focus,a:focus{outline:2px solid var(--blue);outline-offset:3px}.login button{width:100%}.error{color:var(--red)}@media(max-width:700px){main{padding:24px 16px}.intro{display:block}.snapshot{text-align:left;margin-top:14px}.cards{grid-template-columns:repeat(2,1fr)}h1{font-size:26px}header{align-items:flex-start}.ghost{width:36px;height:42px}.panel-head{align-items:flex-start}footer{display:block}.login{margin:5vh auto}}
</style></head><body>{% block body %}{% endblock %}</body></html>
